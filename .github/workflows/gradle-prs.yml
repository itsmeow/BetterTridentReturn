name: 'Build PR'
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.github/**'
      - '.gitignore'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4, with: { fetch-depth: 0 } }
      - { name: 'Set up JDK 21', uses: actions/setup-java@v4, with: { distribution: 'adopt', java-version: '21' } }
      - { name: Build with Gradle, id: build, env: { USE_ALPHAS: false }, run: 'chmod +x gradlew && ./gradlew build' }