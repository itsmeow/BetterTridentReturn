dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    if(rootProject.hasProperty('architectury_version')) {
        modApi "${rootProject.ext.architectury_package}:architectury:${rootProject.architectury_version}"
    }
}
architectury {
    ArrayList<String> platforms = new ArrayList<String>();
    if(rootProject.hasProperty('forge_version')) {
        platforms.push("forge")
    }
    if(rootProject.hasProperty('neoforge_version')) {
        platforms.push("neoforge")
    }
    if(rootProject.hasProperty('fabric_loader_version')) {
        platforms.push("fabric")
    }
    common(platforms)
}